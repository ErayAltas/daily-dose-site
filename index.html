<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Dose</title>
<meta name="description" content="Daily Dose: vitamin ve takviyeler için hatırlatma ve uyum takibi.">
<meta name="theme-color" content="#157a55">
<meta property="og:title" content="Daily Dose">
<meta property="og:description" content="Vitamin ve takviyeler için hatırlatma ve uyum takibi.">
<meta property="og:image" content="https://erayaltas.github.io/daily-dose-site/assets/en/today.webp">
<style>
:root{
  --brand:#157a55;--brand-2:#2fb583;--soft:#e3f3ec;--bg:#f4f8f6;--card:#fff;
  --text:#16211c;--muted:#6a7a73;--line:#dfe8e4;
}
@media (prefers-color-scheme:dark){
  :root{--brand:#2fb583;--brand-2:#157a55;--soft:#1b3a2f;--bg:#0f1613;--card:#19231f;--text:#eef4f1;--muted:#9aaaa3;--line:#2a3631}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* üst çubuk */
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--text);text-decoration:none}
.logo i{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--brand-2),var(--brand));display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
nav select{font:inherit;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px}

/* hero */
.hero{text-align:center;padding:36px 0 8px}
.hero h1{font-size:clamp(38px,7vw,68px);line-height:1.05;letter-spacing:-.02em;margin:0 0 16px;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--brand-2),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:560px;margin:0 auto 26px;color:var(--muted);font-size:clamp(17px,2.4vw,21px)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:16px;font-weight:600;text-decoration:none;font-size:17px}
.btn.primary{background:var(--brand);color:#fff}
.btn.soon{background:var(--soft);color:var(--brand)}
.note{display:block;margin-top:10px;font-size:14px;color:var(--muted)}

/* telefonlar */
.phones{display:flex;gap:26px;justify-content:center;align-items:flex-start;margin:44px auto 0;padding:0 20px 8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.phone{flex:0 0 auto;width:min(250px,64vw);scroll-snap-align:center;margin:0}
.phone:nth-child(even){margin-top:38px}
.phone div{border:9px solid #14161a;border-radius:38px;overflow:hidden;position:relative;background:#14161a;box-shadow:0 24px 50px rgba(21,122,85,.25)}
.phone div::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:34%;height:15px;border-radius:10px;background:#000;z-index:2}
.phone img{display:block;width:100%;height:auto}
.phone figcaption{text-align:center;font-size:14px;color:var(--muted);margin-top:12px}
@media (min-width:1100px){.phones{overflow:visible;gap:22px}.phone{width:188px}}

/* bölümler */
section{padding:72px 0 0}
h2{font-size:clamp(28px,4.5vw,40px);line-height:1.12;letter-spacing:-.015em;margin:0 0 12px;text-align:center}
.lead{max-width:600px;margin:0 auto 34px;color:var(--muted);text-align:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.card .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:16px}

.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));max-width:760px;margin:0 auto}
.plan{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
.plan.pro{border:2px solid var(--brand)}
.plan h3{margin:0 0 4px;font-size:22px}
.plan small{color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:16px 0 0}
.plan li{padding:6px 0 6px 28px;position:relative}
.plan li::before{content:"✓";position:absolute;left:0;color:var(--brand);font-weight:700}

.privacy{background:var(--soft);border-radius:26px;padding:34px 24px;text-align:center}
.privacy h2{margin-bottom:10px}
.privacy p{max-width:620px;margin:0 auto 18px;color:var(--muted)}

footer{margin-top:72px;padding:30px 0 46px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
footer .row{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:14px}
footer p{margin:0 0 8px;max-width:720px}
</style>
</head>

            <li data-i18n="pro1"></li><li data-i18n="pro2"></li><li data-i18n="pro3"></li>

      </div>
    </section>

    <section id="privacy">

        <p data-i18n="privText"></p>
        <a class="btn primary" href="privacy.html" data-i18n="privLink"></a>
      </div>
    </section>
  </main>

  <footer id="support">
    <div class="row">
      <a href="privacy.html" data-i18n="privLink"></a>
      <a href="mailto:altas.erayy@gmail.com" data-i18n="contact"></a>
    </div>
    <p data-i18n="disclaimer"></p>
    <p>© 2026 Eray Altas</p>
  </footer>
</div>

const SHOTS = ["today", "stats", "list", "widget", "reminder"];

function setLang(l) {
  const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t[e.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(e => { e.innerHTML = t[e.dataset.i18nHtml]; });
  document.getElementById("phones").innerHTML = SHOTS.map((s, i) =>
    `<figure class="phone"><div><img src="assets/${l}/${s}.webp" alt="${t.cap[i]}" loading="${i < 3 ? "eager" : "lazy"}"></div><figcaption>${t.cap[i]}</figcaption></figure>`).join("");
  document.getElementById("cta").innerHTML = APP_STORE_URL
    ? `<a class="btn primary" href="${APP_STORE_URL}">${t.ctaGo}</a><span class="note">${t.ctaNote}</span>`
    : `<span class="btn soon">${t.cta}</span><span class="note">${t.ctaNote}</span>`;
  try { localStorage.setItem("lang", l); } catch (e) {}
}

const supported = Object.keys(T);
let lang = null;
try { lang = localStorage.getItem("lang"); } catch (e) {}
if (!supported.includes(lang)) {
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  lang = supported.includes(nav) ? nav : "en";
}
const sel = document.getElementById("lang");
sel.value = lang;
sel.addEventListener("change", () => setLang(sel.value));
setLang(lang);
