<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Dose</title>
<meta name="description" content="Daily Dose: vitamin ve takviyeler için hatırlatma ve uyum takibi.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2fb583">
<meta property="og:title" content="Daily Dose">
<meta property="og:description" content="Vitamin ve takviyeler için hatırlatma ve uyum takibi.">
<meta property="og:image" content="https://erayaltas.github.io/daily-dose-site/assets/en/today.webp">
<style>
:root{
  color-scheme:light;
  --g1:#2fb583;--g2:#157a55;--g3:#0d5c42;
  --bg:#f4f8f6;--soft:#e3f3ec;--card:#fff;--text:#16211c;--muted:#5f6f68;--line:#dbe6e1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--g2)}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(170deg,var(--g1) 0%,var(--g2) 62%,var(--g3) 100%);color:#fff;overflow:hidden;position:relative}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero::before{width:560px;height:560px;left:-200px;top:140px}
.hero::after{width:420px;height:420px;right:-140px;top:-120px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#fff;text-decoration:none}
.logo i{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;font-style:normal;font-size:19px}
nav select{font:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 10px}
nav select option{color:#16211c}
.hero-inner{text-align:center;padding:34px 0 0;position:relative;z-index:2}
.hero h1{font-size:clamp(42px,8vw,84px);line-height:1.02;letter-spacing:-.025em;margin:0 0 18px;font-weight:800}
.hero p{max-width:600px;margin:0 auto 28px;font-size:clamp(18px,2.6vw,23px);color:rgba(255,255,255,.88)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;font-weight:700;text-decoration:none;font-size:17px}
.btn.white{background:#fff;color:var(--g2)}
.btn.green{background:var(--g2);color:#fff}
.note{display:block;margin-top:12px;font-size:14px;color:rgba(255,255,255,.75)}

/* telefon (CSS çerçeve) */
.phone{position:relative;width:100%;max-width:300px}
.phone .scr{border:11px solid #0e1012;border-radius:46px;overflow:hidden;background:#0e1012;position:relative;box-shadow:0 0 0 2px #3a3e44,0 40px 70px rgba(5,40,28,.4)}
.phone .scr::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:33%;height:17px;border-radius:10px;background:#000;z-index:2}
.phone img{display:block;width:100%;height:auto}

.fan{display:flex;justify-content:center;align-items:flex-end;gap:0;margin-top:46px;height:clamp(330px,52vw,560px);position:relative;z-index:2}
.fan .phone{flex:0 0 auto;width:clamp(150px,27vw,290px)}
.fan .side{width:clamp(130px,23vw,250px);margin-bottom:-60px}
.fan .left{transform:translateX(18%) rotate(-7deg);transform-origin:bottom right}
.fan .right{transform:translateX(-18%) rotate(7deg);transform-origin:bottom left}
.fan .mid{z-index:3;margin-bottom:-90px}

/* ---------- özellik satırları ---------- */
section{padding:84px 0 0}
h2{font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-bottom:84px}
.row:nth-child(even) .txt{order:2}
.row .txt p{margin:0;font-size:19px;color:var(--muted);max-width:460px}
.row .vis{display:flex;justify-content:center;background:var(--soft);border-radius:40px;padding:44px 20px 0;overflow:hidden}
.row .vis .phone{max-width:270px;margin-bottom:-60px}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);margin-bottom:10px}
@media(max-width:820px){.row{grid-template-columns:1fr;gap:26px}.row:nth-child(even) .txt{order:0}.row .txt{text-align:center}.row .txt p{margin:0 auto}}

.mini{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:10px}
.mini>div{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.mini .ic{font-size:26px;margin-bottom:8px}
.mini h3{margin:0 0 6px;font-size:19px}
.mini p{margin:0;color:var(--muted);font-size:16px}

/* ---------- planlar ---------- */
.center{text-align:center}
.lead{max-width:600px;margin:0 auto 34px;color:var(--muted)}
.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));max-width:780px;margin:0 auto}
.plan{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;text-align:left}
.plan.pro{background:linear-gradient(165deg,var(--g1),var(--g2));color:#fff;border:0}
.plan h3{margin:0 0 4px;font-size:24px}
.plan small{opacity:.75}
.plan ul{list-style:none;padding:0;margin:18px 0 0}
.plan li{padding:7px 0 7px 30px;position:relative}
.plan li::before{content:"✓";position:absolute;left:0;font-weight:800;color:var(--g2)}
.plan.pro li::before{color:#fff}

/* ---------- gizlilik bandı ---------- */
.band{background:linear-gradient(170deg,var(--g1),var(--g3));color:#fff;border-radius:34px;padding:48px 26px;text-align:center;margin-top:84px}
.band h2{margin-bottom:12px}
.band p{max-width:620px;margin:0 auto 22px;color:rgba(255,255,255,.88)}

footer{margin-top:84px;padding:30px 0 50px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
footer .links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:14px}
footer p{margin:0 0 8px;max-width:720px}
</style>
</head>

  <div class="wrap">
    <header>
      <a class="logo" href="#"><i>💊</i>Daily Dose</a>

        <select id="lang" aria-label="Language">

  <section class="center" id="pricing">

    <p class="lead" data-i18n="plansLead"></p>
    <div class="plans">
      <div class="plan">
        <h3 data-i18n="freeName"></h3><small data-i18n="freeSub"></small>
        <ul><li data-i18n="free1"></li><li data-i18n="free2"></li><li data-i18n="free3"></li><li data-i18n="free4"></li></ul>

      <div class="plan pro">

    <p data-i18n="privText"></p>
    <a class="btn white" href="privacy.html" data-i18n="privLink"></a>
  </div>

  <footer id="support">
    <div class="links">
      <a href="privacy.html" data-i18n="privLink"></a>
      <a href="mailto:altas.erayy@gmail.com" data-i18n="contact"></a>
    </div>
    <p data-i18n="disclaimer"></p>
    <p>© 2026 Eray Altas</p>
  </footer>
</main>

function setLang(l) {
  const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = e.dataset.i18n.startsWith("cap") ? t.cap[+e.dataset.i18n.slice(3)] : t[e.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(e => { e.innerHTML = t[e.dataset.i18nHtml]; });
  document.querySelectorAll("img[data-shot]").forEach(i => { i.src = `assets/${l}/${i.dataset.shot}.webp`; });
  document.getElementById("cta").innerHTML = APP_STORE_URL
    ? `<a class="btn white" href="${APP_STORE_URL}">${t.ctaGo}</a><span class="note">${t.ctaNote}</span>`
    : `<span class="btn white">${t.cta}</span><span class="note">${t.ctaNote}</span>`;
  try { localStorage.setItem("lang", l); } catch (e) {}
}

const supported = Object.keys(T);
let lang = null;
try { lang = localStorage.getItem("lang"); } catch (e) {}
if (!supported.includes(lang)) {
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  lang = supported.includes(nav) ? nav : "en";
}
const sel = document.getElementById("lang");
sel.value = lang;
sel.addEventListener("change", () => setLang(sel.value));
setLang(lang);
